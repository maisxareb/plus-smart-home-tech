server:
  port: 8082

spring:
  application:
    name: analyzer

  datasource:
    url: jdbc:postgresql://localhost:5432/smart_home
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: password

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
    properties:
      security.protocol: PLAINTEXT
    consumer:
      group-id: analyzer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: ru.yandex.practicum.analyzer.serialization.SensorsSnapshotDeserializer
        spring.json.trusted.packages: "*"

grpc:
  client:
    hub-router:
      address: 'static://localhost:59090'
      negotiation-type: plaintext
      enable-keep-alive: true
      keep-alive-without-calls: true

logging:
  level:
    ru.yandex.practicum.analyzer: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.kafka: DEBUG
    org.apache.kafka: WARN